# Canlı konum akışının broker'ı (docs/canli_akis.md › Broker).
# Yalnızca yerel geliştirme içindir: anonim erişim açık, port compose'da 127.0.0.1'e bağlı.

listener 1883
allow_anonymous true

# Kalıcılık kapalı: broker yeniden başlayınca retained mesajlar silinir. Veri seti
# değişirken temiz başlangıç: docker compose -f broker/compose.yaml restart
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
