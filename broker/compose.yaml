# Canlı konum akışının MQTT broker'ı (docs/canli_akis.md › Broker).
# Repo kökünden: docker compose -f broker/compose.yaml up -d
name: aocc-broker

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10
