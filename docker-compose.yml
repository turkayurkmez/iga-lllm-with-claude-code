services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_DB: copilot
      # Yalnızca parola .env'den gelir; API anahtarı db konteynerine verilmez.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Şema yalnızca boş volume'da yüklenir; sıfırlamak için: docker compose down -v
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    # Backend bu aşamada veritabanına bağlanmaz; bağımlılık yalnızca başlatma sırası içindir.
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
